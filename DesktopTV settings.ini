; DesktopTV - the settings that worked best on Benja's PC.
; Close the game, open TheKillingAntidote\Binaries\Win64\ReShade.ini and replace its [DesktopTV] section with
; this one (the section appears after the first start with the add-on). The PCScreen... lines are the
; calibration of Jodi's screen at 1920x1080; redo it if PC mode puts your cursor in the wrong place.
[DesktopTV]
Monitor=2
FPS=30
SRGB=2
TVOpaque=1
TVGamma=100
Width=1264
Height=720
PCScreen=1
PCSRGB=1
PCWidth=1920
PCHeight=1080
PCModeKey=45
HideUIKey=0
HideUI=0
HideUIInPCMode=1
KeepFront=1
CursorScale=1.25
CursorOutline=0
Sound=1
Spatial=1
NearCm=150
FarCm=1200
SoundOutside=0
PCCorner=0
PCScreenLeft=2292
PCScreenTop=565
PCScreenTRx=9849
PCScreenTRy=176
PCScreenRight=9573
PCScreenBottom=9648
PCScreenBLx=2016
PCScreenBLy=8380
